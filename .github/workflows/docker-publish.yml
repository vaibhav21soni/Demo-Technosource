name: Build and push changed services

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  paths-filter:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'backend/Dockerfile'
            frontend:
              - 'frontend/**'
              - 'frontend/Dockerfile'

  build-and-push:
    needs: paths-filter
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: short_sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        if: needs.paths-filter.outputs.backend == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:${{ steps.short_sha.outputs.short_sha }}

      - name: Build and push frontend image
        if: needs.paths-filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:${{ steps.short_sha.outputs.short_sha }}
          build-args: |
            REACT_APP_API_URL=${{ secrets.FRONTEND_API_URL }}

      - name: Clone Argo CD manifests repo
        if: needs.paths-filter.outputs.backend == 'true' || needs.paths-filter.outputs.frontend == 'true'
        env:
          ARGOCD_REPO_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${ARGOCD_REPO_TOKEN}@github.com/vaibhav21soni/demo-argocd.git /tmp/demo-argocd

      - name: Update Argo CD deployment YAMLs
        if: needs.paths-filter.outputs.backend == 'true' || needs.paths-filter.outputs.frontend == 'true'
        run: |
          cd /tmp/demo-argocd/apps/mern
          if [ "${{ needs.paths-filter.outputs.backend }}" = "true" ]; then
            sed -i "s|^\s*image: .*mern-backend:.*$|          image: ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:${{ steps.short_sha.outputs.short_sha }}|" backend-deployment.yaml
          fi
          if [ "${{ needs.paths-filter.outputs.frontend }}" = "true" ]; then
            sed -i "s|^\s*image: .*mern-frontend:.*$|          image: ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:${{ steps.short_sha.outputs.short_sha }}|" frontend-deployment.yaml
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend-deployment.yaml frontend-deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "ci: update Argo CD images to short SHA ${{ steps.short_sha.outputs.short_sha }}"
            git push origin HEAD
          fi

      - name: Install Argo CD CLI
        if: needs.paths-filter.outputs.backend == 'true' || needs.paths-filter.outputs.frontend == 'true'
        run: |
          curl -sSL -o /tmp/argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /tmp/argocd-linux-amd64
          sudo mv /tmp/argocd-linux-amd64 /usr/local/bin/argocd

      - name: Update Argo CD deployment
        if: needs.paths-filter.outputs.backend == 'true' || needs.paths-filter.outputs.frontend == 'true'
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
          ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
          ARGOCD_APP_NAME: ${{ secrets.ARGOCD_APP_NAME }}
        run: |
          # Normalize server address so argocd CLI can parse it cleanly.
          ARGOCD_SERVER="$(printf '%s' "$ARGOCD_SERVER" | tr -d '[:space:]')"
          while [[ "$ARGOCD_SERVER" =~ ^(tcp|http|https):// ]]; do
            ARGOCD_SERVER="${ARGOCD_SERVER#tcp://}"
            ARGOCD_SERVER="${ARGOCD_SERVER#http://}"
            ARGOCD_SERVER="${ARGOCD_SERVER#https://}"
          done
          ARGOCD_SERVER="${ARGOCD_SERVER#/}"
          ARGOCD_SERVER="${ARGOCD_SERVER%/}"
          ARGOCD_SERVER="https://$ARGOCD_SERVER"
          echo "Logging in to Argo CD server: $ARGOCD_SERVER"
          argocd login "$ARGOCD_SERVER" --username "$ARGOCD_USERNAME" --password "$ARGOCD_PASSWORD" --insecure
          argocd app sync "$ARGOCD_APP_NAME"
          argocd app wait "$ARGOCD_APP_NAME" --health --timeout 300
